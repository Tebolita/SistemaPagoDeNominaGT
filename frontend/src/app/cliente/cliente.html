<p-toast></p-toast>
<p-confirmDialog></p-confirmDialog>

<div class="flex flex-col gap-5 p-4 min-h-screen">

  <!-- ── Cabecera ──────────────────────────────────────────────────── -->
  <div class="flex justify-between items-center flex-wrap gap-3">
    <div>
      <h1 class="text-2xl font-bold text-white">Clientes</h1>
      <p class="text-sm text-slate-400 mt-1">Administra clientes y mantén el historial de contactos</p>
    </div>
    <p-button
      label="Nuevo Cliente"
      icon="pi pi-plus"
      severity="success"
      (onClick)="openNew()"
    ></p-button>
  </div>

  <!-- ── Tabla ─────────────────────────────────────────────────────── -->
  <p-table
    [value]="clientes"
    [loading]="loading"
    [paginator]="true"
    [rows]="10"
    [rowHover]="true"
    dataKey="IdCliente"
    emptyMessage="No hay clientes registrados."
  >
    <ng-template pTemplate="header">
      <tr>
        <th pSortableColumn="NombreCliente">Nombre <p-sortIcon field="NombreCliente"></p-sortIcon></th>
        <th style="width:110px">Tipo</th>
        <th>NIT</th>
        <th>DPI</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th style="width:90px">Estado</th>
        <th style="width:90px">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-c>
      <tr>
        <td class="font-medium text-slate-100">{{ c.NombreCliente }}</td>
        <td>
          <p-tag
            [value]="c.TipoCliente || 'N/A'"
            [severity]="c.TipoCliente === 'INDIVIDUAL' ? 'info' : c.TipoCliente === 'EMPRESA' ? 'warn' : 'secondary'"
          ></p-tag>
        </td>
        <td class="font-mono text-sm text-slate-300">{{ c.NIT || '—' }}</td>
        <td class="font-mono text-sm text-slate-300">{{ c.DPI || '—' }}</td>
        <td class="text-slate-400 text-sm">{{ c.Correo || '—' }}</td>
        <td class="text-slate-400 text-sm">{{ c.Telefono || '—' }}</td>
        <td>
          <p-tag
            [value]="c.Activo ? 'Activo' : 'Inactivo'"
            [severity]="c.Activo ? 'success' : 'danger'"
          ></p-tag>
        </td>
        <td>
          <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="warn"
            pTooltip="Editar" tooltipPosition="top" (onClick)="editCliente(c)"></p-button>
          <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
            pTooltip="Eliminar" tooltipPosition="top" (onClick)="deleteCliente(c)"></p-button>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>

<!-- ── Diálogo ───────────────────────────────────────────────────── -->
<p-dialog
  [visible]="clienteDialog"
  (visibleChange)="clienteDialog = $event"
  [header]="isEdit ? 'Editar Cliente' : 'Nuevo Cliente'"
  [modal]="true"
  [style]="{ width: '600px', maxWidth: '95vw' }"
  [resizable]="false"
>
  <div class="flex flex-col gap-4 pt-2">

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <div class="flex flex-col gap-1 sm:col-span-2">
        <label>Nombre *</label>
        <input pInputText [(ngModel)]="clienteForm.NombreCliente"
          placeholder="Nombre completo o razón social" class="w-full" />
      </div>

      <div class="flex flex-col gap-1">
        <label>Tipo de Cliente</label>
        <p-select
          [options]="tiposCliente"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="clienteForm.TipoCliente"
          placeholder="Seleccionar tipo"
          class="w-full"
          appendTo="body"
        ></p-select>
      </div>

      <div class="flex flex-col gap-1">
        <label>NIT</label>
        <input pInputText [(ngModel)]="clienteForm.NIT"
          placeholder="Ej. 12345678-9" class="w-full font-mono" />
      </div>

      <div class="flex flex-col gap-1">
        <label>DPI</label>
        <input pInputText [(ngModel)]="clienteForm.DPI"
          placeholder="13 dígitos" class="w-full font-mono" />
      </div>

      <div class="flex flex-col gap-1">
        <label>Teléfono</label>
        <input pInputText [(ngModel)]="clienteForm.Telefono"
          placeholder="55551234" class="w-full" />
      </div>

      <div class="flex flex-col gap-1 sm:col-span-2">
        <label>Correo Electrónico</label>
        <input pInputText [(ngModel)]="clienteForm.Correo"
          type="email" placeholder="cliente@ejemplo.com" class="w-full" />
      </div>

      <div class="flex flex-col gap-1 sm:col-span-2">
        <label>Dirección</label>
        <textarea pInputTextarea [(ngModel)]="clienteForm.Direccion"
          rows="3" placeholder="Dirección completa" class="w-full"></textarea>
      </div>

    </div>
  </div>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="hideDialog()"></p-button>
    <p-button label="Guardar" icon="pi pi-check" severity="success" (onClick)="saveCliente()"></p-button>
  </ng-template>
</p-dialog>
