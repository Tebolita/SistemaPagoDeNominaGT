<div class="cliente-page">
  <div class="cliente-header">
    <div>
      <h2>Clientes</h2>
      <p>Administra clientes y mantiene el historial de contactos.</p>
    </div>
    <button pButton type="button" label="Nuevo Cliente" icon="pi pi-plus" class="p-button-success" (click)="openNew()"></button>
  </div>

  <p-table [value]="clientes" [loading]="loading" dataKey="IdCliente" responsiveLayout="scroll">
    <ng-template pTemplate="header">
      <tr>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>NIT</th>
        <th>DPI</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-cliente>
      <tr>
        <td>{{ cliente.NombreCliente }}</td>
        <td>{{ cliente.TipoCliente || 'N/A' }}</td>
        <td>{{ cliente.NIT || 'N/A' }}</td>
        <td>{{ cliente.DPI || 'N/A' }}</td>
        <td>{{ cliente.Correo || 'N/A' }}</td>
        <td>{{ cliente.Telefono || 'N/A' }}</td>
        <td>
          <p-tag [value]="cliente.Activo ? 'Activo' : 'Inactivo'" [severity]="cliente.Activo ? 'success' : 'danger'"></p-tag>
        </td>
        <td>
          <button pButton type="button" icon="pi pi-pencil" class="p-button-rounded p-button-text" (click)="editCliente(cliente)"></button>
          <button pButton type="button" icon="pi pi-trash" class="p-button-rounded p-button-danger p-button-text" (click)="deleteCliente(cliente)"></button>
        </td>
      </tr>
    </ng-template>
  </p-table>

  <p-dialog header="{{ isEdit ? 'Editar Cliente' : 'Nuevo Cliente' }}" [(visible)]="clienteDialog" [style]="{ width: '600px' }" [modal]="true" [closable]="false">
    <div class="p-fluid">
      <div class="form-grid">
        <div class="p-field">
          <label for="nombreCliente">Nombre <span class="required">*</span></label>
          <input pInputText id="nombreCliente" [(ngModel)]="clienteForm.NombreCliente" placeholder="Ingrese el nombre del cliente" />
        </div>
        <div class="p-field">
          <label for="tipoCliente">Tipo de Cliente</label>
          <p-select id="tipoCliente" [options]="tiposCliente" optionLabel="label" optionValue="value" [(ngModel)]="clienteForm.TipoCliente" placeholder="Seleccionar tipo" appendTo="body"></p-select>
        </div>
        <div class="p-field">
          <label for="nit">NIT</label>
          <input pInputText id="nit" [(ngModel)]="clienteForm.NIT" placeholder="Ingrese el NIT" />
        </div>
        <div class="p-field">
          <label for="dpi">DPI</label>
          <input pInputText id="dpi" [(ngModel)]="clienteForm.DPI" placeholder="Ingrese el DPI" />
        </div>
        <div class="p-field">
          <label for="correo">Correo Electrónico</label>
          <input pInputText id="correo" [(ngModel)]="clienteForm.Correo" type="email" placeholder="cliente@ejemplo.com" />
        </div>
        <div class="p-field">
          <label for="telefono">Teléfono</label>
          <input pInputText id="telefono" [(ngModel)]="clienteForm.Telefono" placeholder="Ingrese el teléfono" />
        </div>
      </div>
      <div class="p-field">
        <label for="direccion">Dirección</label>
        <textarea pInputTextarea id="direccion" rows="3" [(ngModel)]="clienteForm.Direccion" placeholder="Ingrese la dirección completa"></textarea>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <button pButton type="button" label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
      <button pButton type="button" label="Guardar" icon="pi pi-check" class="p-button-primary" (click)="saveCliente()"></button>
    </ng-template>
  </p-dialog>
</div>
