<div class="menu-card" #menuCard>
  <p-menu [model]="items" class="flex justify-center" styleClass="w-full md:w-60 h-[auto]">

    <!-- ── Logo ──────────────────────────────────────────────────── -->
    <ng-template #start>
      <span class="menu-logo inline-flex items-center gap-2 px-3 py-3">
        @if (empresa()?.Logo) {
          <img [src]="empresa()!.Logo" width="40" height="40" class="block rounded-lg object-contain"
            style="max-width:40px;max-height:40px;" (error)="empresa.set({ ...empresa()!, Logo: '' })" />
        } @else {
          <div class="menu-logo-fallback"><i class="pi pi-building-columns"></i></div>
        }
        <span class="text-lg font-semibold text-white truncate" style="max-width:140px">
          @if (empresa()?.NombreEmpresa) {
            {{ empresa()!.NombreEmpresa }}
          } @else {
            Nomina<span class="text-sky-400"> GT</span>
          }
        </span>
      </span>
      <p-divider />

      <!-- ── Avatar ─────────────────────────────────────────────── -->
      <div class="relative">
        <p-menu #avatarMenu [model]="avatarItems" [popup]="true" appendTo="body" />
        <button pRipple
          (click)="avatarMenu.toggle($event)"
          class="avatar-button w-full border-0 bg-transparent cursor-pointer"
          style="padding: 10px 14px;">
          <div class="flex items-center gap-3 w-full">

            <!-- Círculo con iniciales -->
            <div class="relative flex-shrink-0">
              <div class="initials-avatar">
                {{ initials() }}
              </div>
              <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-400 rounded-full border-2 border-slate-900"></span>
            </div>

            <!-- Info dinámica -->
            <div class="flex flex-col items-start flex-1 min-w-0 text-left">
              <span class="font-semibold text-sm text-slate-100 truncate w-full">
                {{ username() }}
              </span>
              <p-badge
                [value]="role() || 'Sin rol'"
                [severity]="getRoleSeverity()"
                styleClass="mt-1 text-xs"
              />
            </div>

            <i class="pi pi-ellipsis-v text-slate-500 flex-shrink-0 text-xs"></i>
          </div>
        </button>
      </div>
    </ng-template>

    <!-- ── Cabeceras de sección ───────────────────────────────────── -->
    <ng-template #submenuheader let-item>
      <span class="section-header">{{ item.label }}</span>
    </ng-template>

    <!-- ── Ítem de menú con ruta activa ──────────────────────────── -->
    <ng-template #item let-item>
      <a pRipple
        class="menu-link flex items-center cursor-pointer"
        [ngClass]="{ 'menu-link--active': item.routerLink && isActive(item.routerLink) }"
        [routerLink]="item.routerLink">
        <span [class]="item.icon + ' menu-icon'"></span>
        <span class="ms-2 menu-label">{{ item.label }}</span>
        @if (item.badge) {
          <p-badge class="ms-auto" [value]="item.badge" />
        }
      </a>
    </ng-template>

    <ng-template #end></ng-template>
  </p-menu>
</div>
