server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Rendimiento: compresión de texto
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Seguridad: cabeceras defensivas (la API añade las suyas con helmet)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Evita subidas desmesuradas (fotografías de empleados, etc.)
  client_max_body_size 10m;

  # La API se reenvía al contenedor del backend: el navegador usa el mismo origen y no necesita CORS
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Archivos con hash en el nombre: se pueden cachear un año
  location ~* \.(?:js|css|woff2?|ico|png|jpg|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Rutas de Angular: cualquier ruta desconocida carga la aplicación (index.html sin caché)
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/ /index.html;
  }
}
