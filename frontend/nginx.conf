server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # La API se reenvía al contenedor del backend: el navegador usa el mismo origen y no necesita CORS
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Rutas de Angular: cualquier ruta desconocida carga la aplicación
  location / {
    try_files $uri $uri/ /index.html;
  }
}
