[pytest]
testpaths = tests
addopts = -v --html=results/reporte.html --self-contained-html
markers =
    smoke: casos principales para una verificación rápida
    login: pantalla de inicio de sesión y cierre de sesión
    navegacion: rutas, guards y menú
    bancos: módulo Bancos
    departamentos: módulo Departamentos
    puestos: módulo Puestos
    jornadas: módulo Jornadas Laborales
    empleados: módulo Empleados
    clientes: módulo Clientes
    seguridad: regresión de defectos de seguridad por API (D-01, D-02, D-04)
    desempeno: eficiencia de desempeño (tiempos de respuesta, concurrencia y carga de pantallas)
    accesibilidad: WCAG 2.1 A/AA con axe-core
    compatibilidad: suite funcional ejecutada en Chrome, Edge y Firefox (ver ejecutar_compatibilidad.ps1)
    negativo: validaciones y casos de error
